services:
  api:
    build: .
    restart: unless-stopped
    environment:
      SENTINEL_DB_PATH: /data/sentinel_events.sqlite3
      SENTINEL_BOOTSTRAP_TOKEN: ${SENTINEL_BOOTSTRAP_TOKEN:?Set a strong bootstrap secret in .env}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in .env}
    volumes:
      - sentinel_data:/data
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
    security_opt:
      - no-new-privileges:true
  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      SENTINEL_DOMAIN: ${SENTINEL_DOMAIN:?Set SENTINEL_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
volumes:
  sentinel_data:
  caddy_data:
  caddy_config:
